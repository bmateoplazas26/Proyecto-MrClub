<!DOCTYPE html>
<html lang = "es">
    <head>
        <meta charset="UTF-8">
        <title>Mr Club</title>
        <link rel="stylesheet" href="../accets/css/estilos.css">
    </head>
    <body>
        <div>
            <h2>Registro de Asociados - Acerias</h2>

            <form id="formRegistro" action="../modelo/guardarAsociado.php" method="POST">
                <div class="grupo-input">
                    <label>Ingresar Documento:</label>
                    <input id="documento" type="number" name="documento" placeholder="ejemplo: 1052840957">
                </div>
                <div class="grupo-input">
                    <label>Nombre: </label>
                    <input type="text" id="nombre" name="nombres" required placeholder="Ingrese nombres completos">
                </div>
                 <div class="grupo-input">
                    <label>Apellidos: </label>
                    <input type="text" id="apellido" name="apellidos" required placeholder="Ingrese Apellidos completos">
                </div>
                 <div class="grupo-input">
                    <label>Fecha de nacimiento: </label>
                    <input type="date" id="fechaNacimiento" name="fechaNacimiento" required placeholder="ejemplo: 26/08/2008">
                </div>
                 <div class="grupo-input">
                    <label>Ingresar direccion: </label>
                    <input type="text" id="direccion" name="direccion" required placeholder="ejemplo: Calle 14 #12-23">
                </div>
                 <div class="grupo-input">
                    <label>Ingresar telefono: </label>
                    <input type="text" id="telefono" name="telefono" required placeholder="ejemplo: 3214440980">
                </div>
                 <div class="grupo-input">
                    <label>Ingresar su Email: </label>
                    <input type="text" id="Email" name="Email" required placeholder="ejemplo: mateo@gmail.com">
                </div>
                <div class="grupo-input">
                    <label>Ingresar su ciudad: </label>
                    <select id ="ciudad" name="ciudad" required>
                        <option value = "sogamoso" > Sogamoso </option>
                        <option value = "duitama" > Duitama </option>
                        <option value = "nobsa" > Nobsa </option>
                    </select>
                </div>
                 <div class="grupo-input">
                    <label>Ingrese su genero: </label>
                    <input type="radio" id="femenino" name="genero" value="Femenino">
                    <label for="femenino">femenino</label>
                    <input type="radio" id="masculino" name="genero" value="Masculino">
                    <label for="masculino">masculino</label>
                    <input type="radio" id="otro" name="genero" value="Otro">
                    <label for="otro">otro</label>
                </div>

                <div class="grupo-input">
                                        <label> Ingresar su contraseña </label>
                                        <input type="password" id="contraseña" name="contraseña" required
                                            placeholder="Ejemplo: ********">
                                    </div>
                                    <div class="grupo-input">
                                        <label> Confirmar contraseña </label>
                                        <input type="password" id="confirmarContraseña" name="confirmarContraseña" required
                                            placeholder="Ejemplo: ********">
                                    </div>
                <div class="grupo-botones">
                    <button type="submit">Guardar</button>
                    <button type="reset">Limpiar formulario</button>
                </div>
                <p id="mensajeRegistro" role="status" aria-live="polite"></p>

            </form>
        </div>
    </body>
    <script src="../controlador/asociado.js"></script>
</html>
